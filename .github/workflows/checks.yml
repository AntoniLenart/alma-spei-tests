name: Checks

# Static checks that need no running app: lint, formatting, types, and test
# collection. The app-backed suite (Docker + JDK + Clojure) runs locally.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint, types and collection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Collect tests
        run: uv run pytest --collect-only -q -p no:cacheprovider
