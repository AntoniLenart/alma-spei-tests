name: Checks

# Static checks that need no running app: lint, formatting, types, and test
# collection. The app-backed suite runs in regression.yml (and locally).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint, types and collection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Collect tests
        run: uv run pytest --collect-only -q -p no:cacheprovider

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      # Known vulnerabilities in the suite's own dependencies (PyPI advisory data).
      # The audit tool is fetched for this step only; it is not a project dependency.
      - name: Audit installed packages
        run: uv run --with pip-audit pip-audit --skip-editable
